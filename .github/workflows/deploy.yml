name: CI/CD - Frontend

# Only fires on changes under source-codes/frontend/** — this repo has no other
# deployable service (see docs/pra-development/4-ARCHITECTURE.md: no backend,
# no ai-service, no mobile client), so there is only one job pair here, unlike
# a multi-service pipeline where each service gets its own path-filtered job.
on:
  push:
    branches: [main, dev]
    paths:
      - "source-codes/frontend/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "source-codes/frontend/**"

defaults:
  run:
    working-directory: source-codes/frontend

# Serialize deploys — two `pm2 restart` runs against the same VPS process would
# race each other. Mirrors a GitLab `resource_group`.
concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: source-codes/frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy to VPS
    needs: build
    # Only fires once a commit lands on main (direct push or a merged PR) — not
    # on pull_request pipelines for feature branches, which would deploy
    # unreviewed code.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # No .env restore step here (unlike a backend/CMS service): this app has
      # no API keys, database URLs, or other secrets — see
      # docs/pasca-development/1-SECURITY-CHECKLIST.md. Nothing to copy onto
      # the VPS beyond the source code itself.
      #
      # Idempotent: clones the repo if this is the first run on a fresh VPS,
      # otherwise just pulls. `pm2 startOrReload` starts the process if it
      # doesn't exist yet, or reloads it (re-reading ecosystem.config.js —
      # including the PORT) if it does, so a port change in that file takes
      # effect on the very next deploy with no manual VPS step. Node.js, PM2,
      # Nginx, Certbot, the Nginx site config, and the TLS cert are NOT
      # provisioned here — those are one-time, sudo-requiring steps done
      # manually (docs/pasca-development/2-DEPLOYMENT-GUIDE.md §2-5). The
      # deploy SSH user intentionally does not need sudo for this script.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            REPO_DIR=~/mrizqi-portofolio-website
            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone https://github.com/m-rizqi/mrizqi-portofolio-website.git "$REPO_DIR"
            fi
            cd "$REPO_DIR"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            cd source-codes/frontend
            npm install
            npm run build
            pm2 startOrReload ecosystem.config.js
            pm2 save
